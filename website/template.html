<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Data-oriented design and entity component systems in Rust, from cache-aware layouts to a complete archetype ECS and game.">
<title>rust-dod | Data-oriented design in Rust</title>
<link rel="canonical" href="https://ibrahimhindawi.com/rust-dod/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="color-scheme" content="light dark">
<script>try{var t=localStorage.getItem('ibrahimhindawi-site-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: a reference manual. A fixed index of lessons on the left, one view at a
   time on the right; each lesson splits into Guide, Code and Output. */
:root {
  --paper: #f3f5f8;
  --panel: #ffffff;
  --ink: #1a1f29;
  --muted: #5a6373;
  --rule: #d8dde6;
  --accent: #2647c8;
  --accent-soft: #e3e9fb;
  --copper: #a4541a;
  --plum: #7a3e9d;
  --teal: #0f7a62;
  --term-bg: #1c2130;
  --term-fg: #d7deea;
  --cell-used: #2647c8;
  --cell-used-fg: #ffffff;
  --cell-idle: #dfe3ea;
  --cell-idle-fg: #4a5262;

  --display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  --step--1: 0.8125rem;
  --step-0: 1rem;
  --step-1: 1.0625rem;
  --step-2: 1.375rem;
  --step-3: 2.25rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11141a; --panel: #171b23; --ink: #dce1ea; --muted: #8f99a9; --rule: #272d38;
    --accent: #8fa7ff; --accent-soft: #1f2a4c; --copper: #e3a36c; --plum: #c99ee3; --teal: #6fd3b4;
    --term-bg: #0b0d12; --term-fg: #d7deea; --cell-used: #8fa7ff; --cell-used-fg: #0b0d12;
    --cell-idle: #262c37; --cell-idle-fg: #a3adbd;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11141a; --panel: #171b23; --ink: #dce1ea; --muted: #8f99a9; --rule: #272d38;
  --accent: #8fa7ff; --accent-soft: #1f2a4c; --copper: #e3a36c; --plum: #c99ee3; --teal: #6fd3b4;
  --term-bg: #0b0d12; --term-fg: #d7deea; --cell-used: #8fa7ff; --cell-used-fg: #0b0d12;
  --cell-idle: #262c37; --cell-idle-fg: #a3adbd;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: var(--step-0);
  line-height: 1.55;
}
a { color: var(--accent); text-underline-offset: 0.18em; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

.shell {
  display: grid;
  grid-template-columns: 17.5rem minmax(0, 1fr);
  gap: 2.5rem;
  max-width: 82rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 1.5rem 4rem;
}

/* ---- index ---- */
.index {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 1.5rem);
  align-self: start;
  max-height: calc(100vh - 3rem);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
  font-family: var(--display);
}
.brand { display: flex; flex-direction: column; gap: 0.15rem; padding-bottom: 1rem; border-bottom: 1px solid var(--rule); }
.brand b { font-family: var(--mono); font-weight: 600; font-size: 1.25rem; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: var(--step--1); }
.site-links { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 0.8rem; margin-top: 0.55rem; }
.site-links a, .theme-link {
  color: var(--muted);
  font: 500 0.72rem/1.3 var(--mono);
  text-decoration: none;
}
.site-links a:hover, .theme-link:hover { color: var(--accent); }
.theme-link { appearance: none; border: 0; padding: 0; background: none; cursor: pointer; }
.group { display: flex; flex-direction: column; gap: 0.15rem; }
.group h2 {
  margin: 0 0 0.35rem;
  font: 600 0.6875rem/1 var(--mono);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.navlink {
  display: grid;
  grid-template-columns: 1.6rem minmax(0, 1fr);
  gap: 0.5rem;
  padding: 0.45rem 0.6rem 0.5rem 0.4rem;
  border-radius: 5px;
  color: var(--ink);
  text-decoration: none;
}
.navlink:hover { background: var(--accent-soft); }
.navlink[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.num { font: 600 var(--step--1)/1.5 var(--mono); color: var(--accent); text-align: right; font-variant-numeric: tabular-nums; }
.num.dim { color: var(--muted); }
.nt { display: flex; flex-direction: column; min-width: 0; }
.ttl { font-weight: 600; font-size: 1rem; line-height: 1.25; overflow-wrap: anywhere; }
.blurb { font-family: var(--body); font-size: var(--step--1); color: var(--muted); line-height: 1.35; }

/* ---- views ---- */
main { min-width: 0; }
.view { display: flex; flex-direction: column; gap: 1.5rem; min-width: 0; }
.vhead { display: flex; flex-direction: column; gap: 0.35rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--rule); }
.vhead h1 {
  margin: 0;
  font: 700 var(--step-3)/1.05 var(--display);
  letter-spacing: -0.01em;
  text-wrap: balance;
}
.eyebrow { margin: 0; font: 600 0.6875rem/1.2 var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.path { margin: 0; font: 400 var(--step--1)/1.4 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.lede { margin: 0.25rem 0 0; max-width: 60ch; font-size: var(--step-1); color: var(--muted); }

.tabs { display: flex; gap: 0.25rem; border-bottom: 1px solid var(--rule); overflow-x: auto; }
.tab {
  appearance: none; border: 0; background: none; cursor: pointer;
  padding: 0.6rem 0.9rem 0.55rem;
  font: 600 0.95rem/1 var(--display);
  color: var(--muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  white-space: nowrap;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.count { font: 400 0.7rem/1 var(--mono); color: var(--muted); margin-left: 0.3rem; }
.pane { min-width: 0; display: flex; flex-direction: column; gap: 0.75rem; }

/* ---- prose ---- */
.prose { max-width: 68ch; display: flex; flex-direction: column; gap: 0.9rem; }
.prose > * { margin: 0; }
.prose h2 {
  margin-top: 1.2rem;
  font: 600 var(--step-2)/1.2 var(--display);
  text-wrap: balance;
}
.prose h3 { margin-top: 0.8rem; font: 600 1.1rem/1.25 var(--display); }
.prose p, .prose li { font-size: var(--step-1); line-height: 1.62; }
.prose ul, .prose ol { padding-left: 1.3rem; display: flex; flex-direction: column; gap: 0.5rem; }
.prose li::marker { color: var(--muted); font-family: var(--mono); font-size: 0.85em; }
.prose strong { font-weight: 600; }
code { font-family: var(--mono); font-size: 0.86em; }
.prose :not(pre) > code, .note code, .figtext code, figcaption code {
  background: var(--accent-soft);
  padding: 0.08em 0.3em;
  border-radius: 3px;
  overflow-wrap: anywhere;
}
pre.snip {
  margin: 0;
  padding: 0.85rem 1rem;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 6px;
  overflow-x: auto;
  font: 400 0.84rem/1.55 var(--mono);
}
pre.snip code { font-size: inherit; }
.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font: 600 0.75rem/1.2 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
tbody tr:last-child td { border-bottom: 0; }
td:first-child { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); width: 2.5rem; }
/* Two-column tables, like each guide's rin | Rust notes, split the width. */
td:first-child:nth-last-child(2) { font-family: inherit; color: inherit; width: 45%; }

.note { margin: 0; font-size: 0.95rem; color: var(--muted); }

/* ---- code ---- */
pre.code {
  margin: 0;
  padding: 0.9rem 0;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 6px;
  overflow-x: auto;
  font: 400 0.8125rem/1.6 var(--mono);
  tab-size: 4;
}
pre.code code { font-size: inherit; display: block; min-width: max-content; }
.ln { display: block; padding-right: 1.25rem; white-space: pre; }
.ln:hover { background: var(--accent-soft); }
.no {
  display: inline-block;
  width: 3.4rem;
  padding-right: 1rem;
  text-align: right;
  color: var(--muted);
  opacity: 0.7;
  user-select: none;
  font-variant-numeric: tabular-nums;
}
.c-com { color: var(--muted); font-style: italic; }
.c-str { color: var(--copper); }
.c-num { color: var(--teal); }
.c-kw { color: var(--accent); font-weight: 500; }
.c-ty { color: var(--plum); }
.c-def { font-weight: 600; }
.c-mac { color: var(--teal); }
.c-attr { color: var(--muted); }
.filehead { margin: 1rem 0 0; font: 600 0.9rem/1.3 var(--mono); color: var(--muted); }
.filehead:first-of-type { margin-top: 0; }

pre.term {
  margin: 0;
  padding: 1rem 1.2rem;
  background: var(--term-bg);
  color: var(--term-fg);
  border-radius: 6px;
  overflow-x: auto;
  font: 400 0.8125rem/1.55 var(--mono);
  font-variant-numeric: tabular-nums;
}

/* ---- memory strip ---- */
.memmap {
  margin: 0;
  max-width: 68ch;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  padding: 1.1rem 1.2rem 1.2rem;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 8px;
}
.memmap figcaption { display: flex; flex-direction: column; gap: 0.2rem; font-size: var(--step-1); }
.strip {
  position: relative;
  display: flex;
  gap: 2px;
  height: 2.6rem;
}
.strip::after {
  content: "";
  position: absolute;
  top: -0.35rem;
  bottom: -0.35rem;
  left: calc(64 / 68 * 100%);
  border-left: 2px dashed var(--ink);
}
.f {
  flex: var(--b) 1 0;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 3px;
  background: var(--cell-idle);
  color: var(--cell-idle-fg);
  font: 500 0.7rem/1 var(--mono);
  white-space: nowrap;
  overflow: hidden;
}
.f.use { background: var(--cell-used); color: var(--cell-used-fg); }
.ruler { position: relative; height: 1.1rem; font: 400 0.7rem/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.ruler span { position: absolute; left: calc(var(--at) / 68 * 100%); transform: translateX(-50%); white-space: nowrap; }
.ruler span:first-child { transform: none; }
.ruler span:last-child { transform: translateX(-100%); }
.ruler span:nth-child(3) { transform: translateX(-100%); padding-right: 0.4rem; }
.legend { display: flex; flex-wrap: wrap; gap: 0.4rem 1.2rem; font: 400 0.78rem/1.3 var(--mono); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
.sw { display: inline-block; width: 0.8rem; height: 0.8rem; border-radius: 2px; background: var(--cell-idle); }
.sw.use { background: var(--cell-used); }
.figtext { margin: 0.2rem 0 0; font-size: 0.97rem; color: var(--muted); }
.figtext strong { color: var(--ink); font-family: var(--mono); font-weight: 500; font-size: 0.92em; font-variant-numeric: tabular-nums; }

/* ---- narrow ---- */
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 1.25rem; padding-block: 1rem 3rem; }
  .index {
    position: static;
    max-height: none;
    overflow: visible;
    gap: 0.6rem;
  }
  .brand { padding-bottom: 0.6rem; }
  .groups { display: flex; gap: 0.35rem; overflow-x: auto; padding-bottom: 0.4rem; }
  .group { flex-direction: row; gap: 0.35rem; }
  .group h2 { display: none; }
  .navlink {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    gap: 0.35rem;
    padding: 0.4rem 0.65rem;
    border: 1px solid var(--rule);
    white-space: nowrap;
  }
  .nt { min-width: auto; }
  .num { line-height: 1.25; }
  .blurb { display: none; }
  .ttl { font-size: 0.92rem; overflow-wrap: normal; }
  .vhead h1 { font-size: 1.85rem; }
  .prose p, .prose li { font-size: var(--step-0); }
  .f { font-size: 0.6rem; }
}
@media (min-width: 901px) {
  .groups { display: flex; flex-direction: column; gap: 1.25rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .navlink, .tab { transition: background-color 120ms ease, color 120ms ease; }
}
</style>
</head>
<body>
<div class="shell">
  <nav class="index" aria-label="Lessons">
    <div class="brand">
      <b>rust-dod</b>
      <span>data-oriented design in Rust</span>
      <div class="site-links">
        <a href="https://ibrahimhindawi.com/">ibrahimhindawi.com</a>
        <a href="https://ibrahimhindawi.com/articles.html">articles</a>
        <a href="https://github.com/IbrahimHindawi/rust-dod" target="_blank" rel="noopener">source</a>
        <button class="theme-link" id="theme-toggle" type="button" aria-label="Switch between light and dark themes">theme</button>
      </div>
    </div>
    <div class="groups">
      {{NAV}}
    </div>
  </nav>
  <main id="main">
{{VIEWS}}
  </main>
</div>

<script>
(function () {
  var views = Array.prototype.slice.call(document.querySelectorAll(".view"));
  var links = Array.prototype.slice.call(document.querySelectorAll(".navlink"));
  var known = {};
  views.forEach(function (v) { known[v.dataset.view] = v; });

  function show(token, scroll) {
    if (!known[token]) token = "overview";
    views.forEach(function (v) { v.hidden = v.dataset.view !== token; });
    links.forEach(function (a) {
      if (a.dataset.view === token) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    var active = document.querySelector('.navlink[aria-current="page"]');
    if (active && active.scrollIntoView && window.matchMedia("(max-width: 900px)").matches) {
      active.scrollIntoView({ block: "nearest", inline: "nearest" });
    }
    if (scroll) window.scrollTo(0, 0);
  }

  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest('a[href^="#"]');
    if (!a) return;
    var token = a.getAttribute("href").slice(1);
    if (!known[token]) return;
    e.preventDefault();
    show(token, true);
    try { history.replaceState(null, "", "#" + token); } catch (err) {}
  });

  views.forEach(function (v) {
    var tabs = Array.prototype.slice.call(v.querySelectorAll(".tab"));
    var panes = Array.prototype.slice.call(v.querySelectorAll(".pane"));
    tabs.forEach(function (t) {
      t.addEventListener("click", function () {
        tabs.forEach(function (o) { o.setAttribute("aria-selected", o === t ? "true" : "false"); });
        panes.forEach(function (p) { p.hidden = p.dataset.pane !== t.dataset.pane; });
      });
    });
  });

  window.addEventListener("hashchange", function () { show(location.hash.slice(1), true); });
  show(location.hash.slice(1), false);

  var themeButton = document.getElementById("theme-toggle");
  if (themeButton) themeButton.addEventListener("click", function () {
    var current = document.documentElement.dataset.theme;
    var dark = current ? current === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("ibrahimhindawi-site-theme", next); } catch (err) {}
  });
})();
</script>
</body>
</html>
